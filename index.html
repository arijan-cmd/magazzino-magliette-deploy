<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Magazzino Magliette</title>

    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32-v2.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-v2.png" />
    <meta name="theme-color" content="#4645c4" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Magazzino" />

    <script>
      (function () {
        var stored = localStorage.getItem('theme');
        var dark = stored ? stored === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (dark) document.documentElement.classList.add('dark');
      })();
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              brand: {
                50: '#f2f4fd',
                100: '#e6e9fb',
                200: '#c9d0f5',
                300: '#a3aeed',
                400: '#7c86e2',
                500: '#5b63d6',
                600: '#4645c4',
                700: '#3936a0',
                800: '#302f81',
                900: '#2a2a67',
                950: '#191a3d',
              },
            },
            boxShadow: {
              soft: '0 1px 2px 0 rgba(15, 23, 42, 0.04), 0 4px 16px -4px rgba(15, 23, 42, 0.08)',
              softer: '0 1px 2px 0 rgba(15, 23, 42, 0.03)',
              card: '0 1px 3px 0 rgba(15, 23, 42, 0.06), 0 1px 2px -1px rgba(15, 23, 42, 0.06)',
            },
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
            },
          },
        },
      };
    </script>
    <style>
      html { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; color-scheme: light; overscroll-behavior-y: none; }
      html.dark { color-scheme: dark; }
      body { font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; touch-action: manipulation; overscroll-behavior-y: none; }
      ::selection { background-color: #c9d0f5; color: #191a3d; }
      ::-webkit-scrollbar { width: 9px; height: 9px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background-color: #cbd5e1; border-radius: 9999px; border: 2px solid transparent; background-clip: content-box; }
      ::-webkit-scrollbar-thumb:hover { background-color: #94a3b8; }
      * { scrollbar-width: thin; scrollbar-color: #cbd5e1 transparent; }
      html.dark ::-webkit-scrollbar-thumb { background-color: #334155; }
      html.dark ::-webkit-scrollbar-thumb:hover { background-color: #475569; }
      html.dark * { scrollbar-color: #334155 transparent; }
      html.dark ::selection { background-color: #3936a0; color: #f2f4fd; }
    </style>
  </head>
  <body class="bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-slate-100 transition-colors duration-200">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
